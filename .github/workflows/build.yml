name: Build Font Manager

on:
  push:
    branches: [ master, feature/scalable-font-ui ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore "CSGO Font Manager.sln"

      - name: Build Release
        run: msbuild "CSGO Font Manager.sln" /m /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Font-Manager-Release
          path: |
            CSGO Font Manager/bin/Release/**
          if-no-files-found: error
